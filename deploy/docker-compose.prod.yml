# Production-style stack. Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# Only the web gateway publishes ports; PostgreSQL and Redis are reachable on the internal network only.
# See docs/operations/runbook.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env.production}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env.production}']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: '4000'
      HOST: 0.0.0.0
      TRUST_PROXY: '1'
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_LOCAL_PATH: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [internal]

  # One-shot: applies pending migrations. Run before starting a new api version:
  #   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    profiles: [ops]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    command: ['node', 'apps/api/dist/db/migrator.js']
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:8080'
      - '${HTTPS_PORT:-443}:8443'
    volumes:
      # Directory with fullchain.pem and privkey.pem (see runbook, TLS).
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR in deploy/.env.production}:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  internal:
    driver: bridge
