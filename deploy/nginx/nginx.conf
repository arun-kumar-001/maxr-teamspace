# Edge gateway: TLS termination, rate limiting, security headers, static web app, /api/v1 proxy.
# Certificates are mounted at /etc/nginx/certs (fullchain.pem, privkey.pem); never baked into the image.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Temp paths writable by the unprivileged user.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 12m; # slightly above the largest upload the API accepts
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Per client IP. The API has its own limiter; this stops floods before they reach Node.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_status 429;

  log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time rid=$request_id';
  access_log /dev/stdout main; # request line without query string: tokens in URLs never reach logs
  error_log /dev/stderr warn;

  upstream api_upstream {
    server api:4000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/api-proxy.conf;
    }

    location /api/v1/ {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/api-proxy.conf;
    }

    # nginx drops server-level add_header when a location sets its own, so every location
    # includes the same header file explicitly.

    # Hashed build assets are immutable; index.html must always be revalidated.
    location /assets/ {
      root /usr/share/nginx/html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }
  }
}
