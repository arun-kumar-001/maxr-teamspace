services:
  postgres:
    image: postgres:16-alpine
    container_name: maxr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-maxr_teamspace}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-maxr_teamspace}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - maxr-network

  redis:
    image: redis:7-alpine
    container_name: maxr-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - maxr-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: maxr-mailpit
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_WEB_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 1025 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - maxr-network

  storage:
    image: adobe/s3mock:latest
    container_name: maxr-storage
    restart: unless-stopped
    ports:
      - '${S3_PORT:-9090}:9090'
    environment:
      initialBuckets: ${S3_BUCKET:-maxr-private-storage}
      debug: 'false'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9090 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - maxr-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mailpit_data:
    driver: local
  storage_data:
    driver: local

networks:
  maxr-network:
    driver: bridge
