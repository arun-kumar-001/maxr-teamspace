name: Deploy

# Continuous Deployment pipeline to Cantobo Server (ADR D-10, Issue #17)
# Deploys containerized stack across staging and production environments.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: 'Check the inputs and stop before connecting. Nothing is deployed.'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Pre-deployment browser checks
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Deploy to Cantobo Server
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ (github.event.inputs.environment || 'production') == 'production' && 'https://teamspace.maxr.internal' || 'https://staging.maxr.internal' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose Specification
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production config -q
        env:
          DB_PASSWORD: deploy-validation-check
          REDIS_PASSWORD: deploy-validation-check

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          load: true
          tags: maxr-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.web
          load: true
          tags: maxr-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the Cantobo server
        # Runs deploy/server-deploy.sh on the host over SSH and waits for the API to be healthy.
        # Without the secrets this step FAILS; only a manual run with dry_run=true may skip it, and
        # it then says that nothing was deployed.
        run: bash deploy/scripts/deploy-remote.sh
        env:
          DEPLOY_REF: ${{ github.sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CANTOBO_HOST: ${{ secrets.CANTOBO_HOST }}
          CANTOBO_SSH_KEY: ${{ secrets.CANTOBO_SSH_KEY }}
          CANTOBO_KNOWN_HOSTS: ${{ secrets.CANTOBO_KNOWN_HOSTS }}
          CANTOBO_USER: ${{ vars.CANTOBO_USER }}
          APP_DIR: ${{ vars.CANTOBO_APP_DIR }}
